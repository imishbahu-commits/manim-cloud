name: Blender Video Studio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Animation topic'
        required: true
        default: 'Why It Sucks to Be a Gladiator'
      duration:
        description: 'Video length in seconds'
        required: false
        default: '40'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDER_VER: "4.2.3"
      TOPIC: ${{ github.event.inputs.topic }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libxkbcommon0 \
            libxxf86vm1 libxi6 libxrender1 libxfixes3 libgomp1 libxrandr2 \
            libxcursor1 libxinerama1 libfontconfig1 libfreetype6 libosmesa6 \
            ffmpeg curl wget unzip

      - name: Download Blender ${{ env.BLENDER_VER }}
        run: |
          if [ ! -f /usr/local/bin/blender ]; then
            URL="https://download.blender.org/release/Blender4.2/blender-${BLENDER_VER}-linux-x64.tar.xz"
            wget -q "$URL" -O /tmp/blender.tar.xz
            sudo tar xf /tmp/blender.tar.xz -C /opt/
            sudo ln -sf /opt/blender-${BLENDER_VER}-linux-x64/blender /usr/local/bin/blender
            echo "BLENDER INSTALLED" && blender --version | head -2
          fi

      - name: Install deps
        run: pip install --quiet edge-tts pillow

      - name: Build scene (headless)
        run: |
          echo "=== Building 3D scene ==="
          blender -b -P scripts/blender_scene.py -- --build-only

      - name: Render segments (headless EEVEE)
        run: |
          echo "=== Rendering segments ==="
          blender -b /tmp/blender_out/scene.blend \
            -P scripts/blender_scene.py -- --render-only

      - name: Voiceover (edge-tts)
        run: |
          pip install --quiet edge-tts
          mkdir -p /tmp/blender_out/audio
          echo "Why it sucks to be a gladiator." > /tmp/narration.txt
          echo "The colosseum. Thousands cheer as you enter the sand." >> /tmp/narration.txt
          echo "Fighting to the death for the crowd's entertainment." >> /tmp/narration.txt
          echo "This is you. A slave with a sword. Fighting for your life." >> /tmp/narration.txt
          i=1
          while IFS= read -r line; do
            edge-tts --voice en-US-ChristopherNeural --text "$line" \
              --write-media "/tmp/blender_out/audio/raw_$(printf '%02d' $i).mp3"
            i=$((i+1))
          done < /tmp/narration.txt

      - name: Stitch final video
        run: |
          mkdir -p output
          DURS="8 10 10 8"
          for i in 1 2 3 4; do
            DUR=$(echo $DURS | cut -d' ' -f$i)
            ffmpeg -y -framerate 30 -i /tmp/blender_out/seg${i}/frame_%04d.png \
              -c:v libx264 -pix_fmt yuv420p -t $DUR \
              output/vid_${i}.mp4 2>/dev/null
            echo "Scene $i: $DUR seconds"
          done
          # Concat videos
          for i in 1 2 3 4; do echo "file 'vid_${i}.mp4'"; done > output/vlist.txt
          ffmpeg -y -f concat -safe 0 -i output/vlist.txt -c copy output/full_video.mp4
          # Concat audio
          for i in 1 2 3 4; do echo "file 'audio/raw_$(printf '%02d' $i).mp3'"; done > output/alist.txt
          ffmpeg -y -f concat -safe 0 -i output/alist.txt -c:a aac -b:a 192k output/audio_only.m4a
          # Merge
          ffmpeg -y -i output/full_video.mp4 -i output/audio_only.m4a \
            -c:v copy -c:a aac -shortest output/final.mp4
          ls -la output/final.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-video
          path: output/final.mp4
          if-no-files-found: error
