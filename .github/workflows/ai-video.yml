name: AI Video Studio

on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Video name (folder under videos/). Suffix _lottie for Lottie mode, or any other for Manim mode.'
        required: true
        default: 'gps_lottie'
      engine:
        description: 'Render engine'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - lottie
          - manim

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            libgirepository1.0-dev pkg-config python3-dev

      - name: Install Lottie stack (high quality)
        run: pip install --quiet pillow

      - name: Install Manim (fallback)
        run: pip install --quiet manim edge-tts || true

      - name: Install edge-tts (voiceover)
        run: pip install --quiet edge-tts

      - name: Determine engine
        id: engine
        run: |
          ENGINE="${{ github.event.inputs.engine }}"
          NAME="${{ github.event.inputs.video_name }}"
          if [ "$ENGINE" = "auto" ]; then
            if echo "$NAME" | grep -qi lottie; then
              ENGINE="lottie"
            else
              ENGINE="manim"
            fi
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "Using engine: $ENGINE"

      - name: Render Lottie (professional quality)
        if: steps.engine.outputs.engine == 'lottie'
        run: |
          echo "=== Rendering Lottie scenes ==="
          python3 scripts/lottie_video.py "${{ github.event.inputs.video_name }}"

      - name: Render Manim (math/technical)
        if: steps.engine.outputs.engine == 'manim'
        run: |
          echo "=== Rendering Manim scenes ==="
          python3 scripts/render_all.py \
            "videos/${{ github.event.inputs.video_name }}/scenes.py" media || \
          python3 scripts/render_all.py \
            "videos/${{ github.event.inputs.video_name }}/scenes.py" media --ql

      - name: Assemble Manim video
        if: steps.engine.outputs.engine == 'manim'
        run: |
          python3 scripts/build_video.py "${{ github.event.inputs.video_name }}"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: |
            output/final.mp4
            output/**/*.mp4
          if-no-files-found: error
